name: Build & Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v2.1.0, v3.0.0, etc.

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --only-binary=:all: -r requirements-build.txt

      - name: Get and validate tag
        id: tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: ${GITHUB_REF_NAME}"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

          echo "TAG_NAME=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Write version metadata
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.TAG_NAME }}"
          printf 'VERSION = "%s"\n' "${VERSION#v}" > orbfarmer/_version.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        run: |
          python build.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Orbfarmer ${{ steps.tag.outputs.TAG_NAME }}
          body: |
            ## Orbfarmer ${{ steps.tag.outputs.TAG_NAME }}
            
            ### Download
            Download `Orbfarmer.exe` below and run it. No Python required!
            
            ### What's new
            See the [commit log](https://github.com/${{ github.repository }}/commits/${{ steps.tag.outputs.TAG_NAME }}) for details.
          files: dist-local/Orbfarmer.exe
          draft: false
          prerelease: false
